version: '3.8'

# Stack de développement MERN : PostgreSQL + Backend Express + Frontend React Router
services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog_mern_dev
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-BlogDevPass2024!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - blog-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d blog_mern_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    container_name: blog-mern-backend-dev
    working_dir: /app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://blog_user:${DB_PASSWORD:-BlogDevPass2024!}@postgres:5432/blog_mern_dev?schema=public
      JWT_SECRET: dev_jwt_secret_change_me_minimum_32_characters
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me_minimum_32_characters
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
    command: sh -c "npm install && npx prisma generate && npm run dev"
    volumes:
      - ./backend-mern:/app
    ports:
      - "3000:3000"
    networks:
      - blog-dev-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 50s

  frontend:
    image: node:20-alpine
    container_name: blog-mern-frontend-dev
    working_dir: /app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 5173
      VITE_BACKEND_TYPE: mern
      VITE_API_URL: http://localhost:3000/api
      VITE_BACKEND_URL_SERVER: http://backend:3000
      VITE_SITE_URL: http://localhost:5173
      VITE_SITE_NAME: "Modern Blog Leader (Dev)"
      VITE_LOCALES: fr,en
      VITE_DEFAULT_LOCALE: fr
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    networks:
      - blog-dev-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  blog-dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
