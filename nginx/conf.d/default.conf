server {

    # Health check    listen 443 ssl http2;

    location /health {    server_name votre-domaine.com www.votre-domaine.com;

        return 200 'healthy';    

        add_header Content-Type text/plain;    # Certificats SSL (remplacez par vos vrais certificats)

    }    ssl_certificate /etc/nginx/ssl/cert.pem;

}    ssl_private_key /etc/nginx/ssl/private.key;
    
    # Configuration SSL optimisée
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozTLS:10m;
    ssl_session_tickets off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # CSP pour la production
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com;" always;
    
    # Root et index
    root /var/www/html;
    index index.html;
    
    # Frontend React Router
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        
        # Headers de cache pour le HTML
        location ~* \.(html)$ {
            proxy_pass http://frontend:3000;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
        
        # Cache des assets statiques
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend:3000;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
        }
    }
    
    # API Strapi
    location /api/ {
        proxy_pass http://strapi:1337/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS pour l'API
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With" always;
        
        if ($request_method = OPTIONS) {
            return 204;
        }
        
        # Rate limiting
        limit_req zone=api burst=20 nodelay;
    }
    
    # Admin Strapi avec authentification
    location /admin/ {
        proxy_pass http://strapi:1337/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Restriction d'accès par IP (optionnel)
        # allow 192.168.1.0/24;
        # deny all;
        
        # Rate limiting strict
        limit_req zone=login burst=5 nodelay;
    }
    
    # Uploads et médias
    location /uploads/ {
        proxy_pass http://strapi:1337/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Cache long pour les médias
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Optimisation par type de fichier
        location ~* \.(jpg|jpeg|png|gif|webp)$ {
            proxy_pass http://strapi:1337;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            
            # Compression d'images à la volée (si module installé)
            # image_filter resize 800 600;
            # image_filter_jpeg_quality 85;
        }
        
        location ~* \.(pdf|doc|docx)$ {
            proxy_pass http://strapi:1337;
            expires 30d;
            add_header Cache-Control "public";
        }
    }
    
    # Sécurité : bloquer l'accès aux fichiers sensibles
    location ~ /\. {
        deny all;
    }
    
    location ~ ^/(\.user.ini|\.htaccess|\.htpasswd|\.sh|\.bak|\.swp|\.swo)$ {
        deny all;
    }
    
    # Robots.txt
    location = /robots.txt {
        proxy_pass http://frontend:3000/robots.txt;
        expires 1d;
    }
    
    # Sitemap
    location = /sitemap.xml {
        proxy_pass http://frontend:3000/sitemap.xml;
        expires 1h;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}