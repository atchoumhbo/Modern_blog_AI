# Production docker-compose - Uses system PostgreSQL
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  # Backend API (uses host PostgreSQL on port 5432)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-mern-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # Connect to PostgreSQL on host machine via Docker gateway
      DATABASE_URL: "postgresql://blog_mern_user:BlogMern2025Prod@host.docker.internal:5432/blog_mern?schema=public"
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      API_KEY_SALT: ${API_KEY_SALT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MAX_FILE_SIZE: 5242880
      UPLOAD_PATH: /app/uploads
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    # Map host.docker.internal to host gateway for PostgreSQL access
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  uploads:
    name: blog_mern_uploads

networks:
  blog-network:
    name: blog_mern_network
